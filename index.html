<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsQuiz04 - カスタムデータ属性でフィルタリング</title>
    <style>
      body {
        width: 700px;
        margin: 20px auto;
        padding: 0 16px;
      }

      .filter-buttons {
        margin-bottom: 20px;
      }

      .filter-buttons button {
        padding: 6px 12px;
        margin-right: 6px;
        cursor: pointer;
      }

      .filter-buttons button.active {
        font-weight: bold;
      }

      .item {
        border: 1px solid #ccc;
        padding: 12px;
        margin-bottom: 10px;
      }

      .item-title {
        font-weight: bold;
      }

      .item-meta {
        font-size: 0.8rem;
        color: #666;
      }

      /* hidden クラスが付いた .item は非表示になる */
      .item.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>コンテンツフィルタリング</h1>

    <div class="filter-buttons">
      <button class="filter-btn filter-all-btn">すべて表示</button>
      <button class="filter-btn" data-genre="anime">アニメ</button>
      <button class="filter-btn" data-genre="movie">映画</button>
      <button class="filter-btn" data-genre="game">ゲーム</button>
    </div>

    <div class="items">
      <div class="item" data-genre="anime">
        <div class="item-title">進撃の巨人</div>
        <div class="item-meta">アニメ</div>
      </div>

      <div class="item" data-genre="movie">
        <div class="item-title">君たちはどう生きるか</div>
        <div class="item-meta">映画</div>
      </div>

      <div class="item" data-genre="game">
        <div class="item-title">ゼルダの伝説</div>
        <div class="item-meta">ゲーム</div>
      </div>
    </div>

    <script>
      // ===== 「変数」と「関数」は用意済みです =====

      // 対象要素をまとめて取得しておく
      const items = document.querySelectorAll('.item');
      const buttons = document.querySelectorAll('.filter-btn');

      // 指定ジャンルの .item だけ表示し、それ以外は .hidden で非表示にする
      const filterItems = function (genre) {
        items.forEach(function (item) {
          if (item.getAttribute('data-genre') === genre) {
            item.classList.remove('hidden');
          } else {
            item.classList.add('hidden');
          }
        });
      };

      // すべての .item を表示する
      const showAllItems = function () {
        items.forEach(function (item) {
          item.classList.remove('hidden');
        });
      };

      // ===== ここから下があなたの課題です =====
      //
      // students/{あなたの学籍番号}/index.html にコピーして提出してください。
      //
      // やること:
      //   .filter-buttons 内の各ボタン（.filter-btn ＝ 変数 buttons）に
      //   click イベントを設定する。
      //   - ジャンルボタン（data-genre="anime" / "movie" / "game"）
      //       → filterItems(そのボタンの data-genre の値) を呼ぶ
      //   - 「すべて表示」ボタン（.filter-all-btn・data-genre なし）
      //       → showAllItems() を呼ぶ
      //
      // 【ヒント】
      //   - const genre = btn.getAttribute('data-genre');
      //   - genre があれば filterItems(genre)、なければ showAllItems()
      //   - items / buttons / filterItems / showAllItems はすでに用意されています
    </script>
  </body>
</html>
