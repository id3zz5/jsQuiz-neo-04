<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsQuiz04 - カスタムデータ属性でフィルタリング</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #333;
      text-align: center;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-buttons button {
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    .filter-buttons button:hover {
      background-color: #0056b3;
    }

    .filter-buttons button.active {
      background-color: #28a745;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .item {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .item:hover {
      transform: translateY(-5px);
    }

    .item.hidden {
      display: none;
    }

    .item-title {
      font-weight: bold;
      font-size: 16px;
      color: #333;
      margin-bottom: 10px;
    }

    .item-meta {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>🎬 コンテンツフィルタリング</h1>

  <div class="filter-buttons">
    <button class="filter-btn filter-all-btn">すべて表示</button>
    <button class="filter-btn" data-genre="anime">アニメ</button>
    <button class="filter-btn" data-genre="movie">映画</button>
    <button class="filter-btn" data-genre="game">ゲーム</button>
  </div>

  <div class="items-grid items">
    <div class="item" data-genre="anime">
      <div class="item-title">進撃の巨人</div>
      <div class="item-meta">
        🎥 TV アニメ
      </div>
    </div>

    <div class="item" data-genre="anime">
      <div class="item-title">推しの子</div>
      <div class="item-meta">
        🎥 TV アニメ
      </div>
    </div>

    <div class="item" data-genre="movie">
      <div class="item-title">君たちはどう生きるか</div>
      <div class="item-meta">
        🎬 映画
      </div>
    </div>

    <div class="item" data-genre="movie">
      <div class="item-title">モンスターズユニバーシティ</div>
      <div class="item-meta">
        🎬 映画
      </div>
    </div>

    <div class="item" data-genre="game">
      <div class="item-title">ゼルダの伝説</div>
      <div class="item-meta">
        🎮 ゲーム
      </div>
    </div>
  </div>

  <script>
    // students/{あなたの学籍番号}/index.html にコピーして提出してください。
    //
    // やること:
    //   1. 関数 filterItems(filterType, filterValue) を定義する
    //      - filterType: 'genre' または 'year'
    //      - filterValue: フィルター値（例: 'anime', '2023'）
    //      - #items 配下のすべての .item を取得する（querySelectorAll）
    //      - 各 item に対して:
    //        * item.getAttribute(filterType) を取得
    //        * filterValue と一致したら display を '' に（表示）
    //        * 一致しなかったら display を 'none' に（非表示）
    //
    //   2. 関数 showAllItems() を定義する
    //      - すべての .item を表示する（display を '' に設定）
    //
    //   3. フィルターボタンに click イベントを設定する
    //      - #filter-anime, #filter-movie, #filter-game → filterItems('genre', '値')
    //      - #filter-2023, #filter-2024, #filter-2025 → filterItems('year', '値')
    //      - #filter-all → showAllItems()
    //
    //   【ヒント】
    //   - const items = document.querySelectorAll('.item');
    //   - const genreValue = item.getAttribute('data-genre');
    //   - item.style.display = 'none';
  </script>
</body>
</html>
